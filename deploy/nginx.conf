# /etc/nginx/conf.d/games-with-words.conf
# Mail-in-a-Box hosts: use the custom config hook, do not drop this in sites-enabled.

server {
    listen 80;
    server_name words.interchained.org;

    access_log /var/log/nginx/games-with-words.access.log;
    error_log  /var/log/nginx/games-with-words.error.log;

    client_max_body_size 1m;

    # ---- WebSocket. The three lines below are load-bearing. ----
    # Without proxy_http_version 1.1 + Upgrade + Connection, nginx silently
    # downgrades the handshake: the lobby loads, players join, and then nothing
    # ever happens. It looks exactly like an app bug. It is not.
    location /ws {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # table talk has no timer; a 60s default would cut the socket mid-story
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
